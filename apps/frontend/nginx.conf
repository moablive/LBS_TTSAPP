server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # O service worker e o HTML nunca podem ser cacheados como imutáveis: um
    # sw.js velho preso no cache deixa o app numa build antiga até alguém dar
    # hard-reload — o oposto do que o PWA deveria resolver.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Health check do backend, exposto ao NAVEGADOR de propósito: é ele que o
    # useVersionCheck consulta para saber que saiu build novo. Sem esta location
    # o /health cairia no try_files e devolveria o index.html.
    location = /health {
        proxy_pass http://lbs_ttsapp_backend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Só os bundles com hash no nome podem ser cache eterno.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://lbs_ttsapp_backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
