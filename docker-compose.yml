# =============================================================================
# LBSTTSAPP (LBSTTSAPP) — Backend Node.js, Frontend Vue 3 PWA e Bot Telegram.
#
# Não sobe banco nem Ollama: usa o server_ollama já existente pela rede externa
# compartilhada `awl_network`, igual ao resto da suite.
#
# Subir:
#   docker compose --env-file ../shared.env --env-file .env up -d --build
# =============================================================================

services:
  lbs_ttsapp_backend:
    build:
      context: apps/backend
    container_name: lbs_ttsapp_backend
    env_file:
      - ../shared.env
      - .env
    environment:
      # Montado a partir do DB_DSN (../shared.env) + DB_NAME (.env), como nos
      # demais apps. O banco entrou para guardar o vinculo telegram->loginhub.
      DATABASE_URL: "${DB_DSN:?defina DB_DSN em ../shared.env}/${DB_NAME:?defina DB_NAME no .env do app}"
      # Versão do build (gerada por scripts/bump-version.mjs). Sai no /health
      # e é o que o front compara para descobrir que houve deploy.
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_BUILD_DATE: ${APP_BUILD_DATE:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      awl_network:
        aliases:
          - lbs_ttsapp_backend
    restart: unless-stopped

  lbs_ttsapp_frontend:
    build:
      context: apps/frontend
      args:
        VITE_LOGINHUB_API_URL: ${VITE_LOGINHUB_API_URL}
        VITE_LOGINHUB_APP_ID: ${VITE_LOGINHUB_APP_ID}
        # Mesma versão do backend, congelada no bundle pelo vite build.
        VITE_APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_APP_BUILD_DATE: ${APP_BUILD_DATE:-}
    container_name: lbs_ttsapp_frontend
    depends_on:
      lbs_ttsapp_backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      awl_network:
        aliases:
          - lbs_ttsapp_frontend
    restart: unless-stopped

  lbs_ttsapp_bot:
    build:
      context: apps/bot
    container_name: lbs_ttsapp_bot
    env_file:
      - ../shared.env
      - .env
    environment:
      # Montado a partir do DB_DSN (../shared.env) + DB_NAME (.env), como nos
      # demais apps. O banco entrou para guardar o vinculo telegram->loginhub.
      DATABASE_URL: "${DB_DSN:?defina DB_DSN em ../shared.env}/${DB_NAME:?defina DB_NAME no .env do app}"
    volumes:
      # Preferências de idioma/voz/velocidade sobrevivem ao redeploy.
      - ./data:/app/data
    networks:
      awl_network:
        aliases:
          - lbs_ttsapp_bot
    restart: unless-stopped

networks:
  awl_network:
    external: true
